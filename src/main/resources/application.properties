spring.application.name=job-scheduler

# =========================
# Database
# =========================

spring.datasource.url=${DB_URL:jdbc:mysql://mysql:3306/job_scheduler_db}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =========================
# JPA / Hibernate
# =========================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =========================
# Redis
# =========================

spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}

# =========================
# Server / Worker
# =========================

server.port=${SERVER_PORT:8080}
worker.instance-id=${WORKER_INSTANCE_ID:local-worker}

# =========================
# Retry
# =========================

job.retry.base-delay-seconds=${JOB_RETRY_BASE_DELAY_SECONDS:5}

# =========================
# Actuator
# =========================

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always

# =========================
# JWT
# =========================

security.jwt.secret=${JWT_SECRET}

# =========================
# Mail
# =========================

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true