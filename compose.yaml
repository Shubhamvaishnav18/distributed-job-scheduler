services:

  mysql:
    image: mysql:8.4

    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}

    volumes:
      - mysql-data:/var/lib/mysql

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u${DB_USERNAME}",
          "-p${DB_PASSWORD}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10


  redis:
    image: redis:7-alpine

    command:
      - redis-server
      - --appendonly
      - yes

    volumes:
      - redis-data:/data

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  worker-1:
    build:
      context: .
      dockerfile: Dockerfile

    image: distributed-job-scheduler:1.0

    environment:
      DB_URL: jdbc:mysql://mysql:3306/${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

      REDIS_HOST: redis
      REDIS_PORT: 6379

      SERVER_PORT: 8080

      WORKER_INSTANCE_ID: worker-1

      JWT_SECRET: ${JWT_SECRET}

      JOB_RETRY_BASE_DELAY_SECONDS: ${JOB_RETRY_BASE_DELAY_SECONDS}

      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}

    depends_on:
      mysql:
        condition: service_healthy

      redis:
        condition: service_healthy

    volumes:
      - job-reports:/app/reports

    restart: unless-stopped


  worker-2:
    image: distributed-job-scheduler:1.0

    environment:
      DB_URL: jdbc:mysql://mysql:3306/${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

      REDIS_HOST: redis
      REDIS_PORT: 6379

      SERVER_PORT: 8080

      WORKER_INSTANCE_ID: worker-2

      JWT_SECRET: ${JWT_SECRET}

      JOB_RETRY_BASE_DELAY_SECONDS: ${JOB_RETRY_BASE_DELAY_SECONDS}

      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}

    depends_on:
      mysql:
        condition: service_healthy

      redis:
        condition: service_healthy

    volumes:
      - job-reports:/app/reports

    restart: unless-stopped


  worker-3:
    image: distributed-job-scheduler:1.0

    environment:
      DB_URL: jdbc:mysql://mysql:3306/${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

      REDIS_HOST: redis
      REDIS_PORT: 6379

      SERVER_PORT: 8080

      WORKER_INSTANCE_ID: worker-3

      JWT_SECRET: ${JWT_SECRET}

      JOB_RETRY_BASE_DELAY_SECONDS: ${JOB_RETRY_BASE_DELAY_SECONDS}

      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}

    depends_on:
      mysql:
        condition: service_healthy

      redis:
        condition: service_healthy

    volumes:
      - job-reports:/app/reports

    restart: unless-stopped


  nginx:
    image: nginx:alpine

    ports:
      - "8080:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

    depends_on:
      - worker-1
      - worker-2
      - worker-3

    restart: unless-stopped


volumes:

  mysql-data:

  redis-data:

  job-reports: